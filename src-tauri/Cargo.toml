[package]
name = "clade"
version = "0.1.0"
description = "Claude Code profile manager"
authors = ["Xanerix"]
edition = "2024"
default-run = "clade-gui"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "clade_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# GUI（windows 子系统）
[[bin]]
name = "clade-gui"
path = "src/main.rs"

# 控制台启动器：clade <profile> [claude 参数]
[[bin]]
name = "clade"
path = "src/bin/clade.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dirs = "6"
junction = "1"
ctrlc = "3"
keyring = { version = "3", features = ["windows-native"] }
tauri-plugin-dialog = "2"
sha2 = "0.11.1"
winreg = "0.56.0"
uuid = { version = "1.29.3", features = ["v4"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_Security"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["rt", "net"] }
axum = "0.8"
chrono = "0.4"
bytes = "1"
futures = "0.3"
async-stream = "0.3"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
